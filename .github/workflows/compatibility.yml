name: LTTng compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Build once / LTTng 2.8, 2.10, 2.12, 2.14
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LTTNG_BUILD_JOBS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      # Keep every runtime in one job so all versions execute identical binaries.
      - name: Build native runtimes and run compatibility checks
        env:
          LTTNG_COMPAT_WORK: ${{ runner.temp }}/lttng-ctl-go-compat
        run: |
          mkdir -p "$LTTNG_COMPAT_WORK"
          sh scripts/test-compat.sh all 2>&1 | tee "$LTTNG_COMPAT_WORK/ci.log"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lttng-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lttng-ctl-go-compat/ci.log
            ${{ runner.temp }}/lttng-ctl-go-compat/logs/
            ${{ runner.temp }}/lttng-ctl-go-compat/bin/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
