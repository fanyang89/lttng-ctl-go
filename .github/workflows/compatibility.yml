name: LTTng compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Build once / LTTng 2.8, 2.10, 2.12, 2.14
    runs-on: [self-hosted, Linux, X64, lttng-ctl-go]
    timeout-minutes: 30
    env:
      GOPROXY: https://goproxy.cn
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Keep every runtime in one job so all versions execute identical binaries.
      - name: Run compatibility checks with preinstalled runtimes
        env:
          LTTNG_COMPAT_WORK: ${{ runner.temp }}/lttng-ctl-go-compat
        run: |
          mkdir -p "$LTTNG_COMPAT_WORK"
          go version
          test "$(go env GOPROXY)" = https://goproxy.cn
          bash scripts/compat/run.sh test 2>&1 | tee "$LTTNG_COMPAT_WORK/ci.log"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lttng-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lttng-ctl-go-compat/ci.log
            ${{ runner.temp }}/lttng-ctl-go-compat/logs/
            ${{ runner.temp }}/lttng-ctl-go-compat/bin/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
